on:
  push:
    branches:
      - main # Splitting out main here ensures we do not redundantly run this workflow on merge from a PR
  pull_request:
    branches:
      - "*" # Match all branches

permissions:
  contents: read

jobs:
  fmt:
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.patch.outputs.commit }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # Format the PR head rather than the merge commit
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: 3.11
      - name: Setup Virtual Environment
        run: make venv
      - name: Format
        run: make fmt
      - name: Update dependencies
        if: ${{ github.actor != 'dependabot[bot]' }}
        run: make reqs
      - name: Check for changes
        id: check_changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "No formatting changes needed"
          fi
      - name: Create formatting patch
        id: patch
        if: ${{ steps.check_changes.outputs.has_changes == 'true' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' }}
        run: |
          git add -A
          git diff --cached --binary > "$RUNNER_TEMP/fmt.patch"
          echo "commit=true" >> "$GITHUB_OUTPUT"
      - name: Upload formatting patch
        if: ${{ steps.patch.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fmt-patch
          path: ${{ runner.temp }}/fmt.patch
          retention-days: 1
      - name: Fail if formatting changes cannot be committed
        if: ${{ steps.check_changes.outputs.has_changes == 'true' && steps.patch.outcome == 'skipped' }}
        run: |
          echo "::error::Formatting or dependency changes required. Run 'make fmt && make reqs' locally and commit the result."
          git diff --stat
          exit 1

  # Separate runner so the App key is never exposed to code from the PR
  commit:
    needs: fmt
    if: ${{ needs.fmt.outputs.commit == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Download formatting patch
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fmt-patch
          path: ${{ runner.temp }}/fmt-patch
      - name: Apply formatting patch
        run: git apply "$RUNNER_TEMP/fmt-patch/fmt.patch"
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.PANTHER_BOT_APP_ID }}
          private-key: ${{ secrets.PANTHER_BOT_APP_PRIVATE_KEY }}
          permission-contents: write
      - name: Commit formatting changes
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # createCommitOnBranch commits are signed by GitHub
          additions=$(
            { git diff --name-only --diff-filter=d; git ls-files --others --exclude-standard; } |
              while IFS= read -r path; do
                jq --null-input --arg path "$path" --rawfile contents <(base64 -w0 "$path") '{$path, $contents}'
              done | jq --slurp .
          )
          deletions=$(git diff --name-only --diff-filter=D | jq --raw-input '{path: .}' | jq --slurp .)
          jq --null-input \
            --arg repo "$REPO" --arg branch "$BRANCH" --arg oid "$HEAD_SHA" \
            --argjson additions "$additions" --argjson deletions "$deletions" \
            '{
              query: "mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { url } } }",
              variables: {input: {
                branch: {repositoryNameWithOwner: $repo, branchName: $branch},
                expectedHeadOid: $oid,
                message: {headline: "Auto-format files"},
                fileChanges: {additions: $additions, deletions: $deletions}
              }}
            }' |
            gh api graphql --input -
