on:
  push:
    branches:
      - main # Splitting out main here ensures we do not redundantly run this workflow on merge from a PR
  pull_request:
    branches:
      - "*" # Match all branches

permissions:
  contents: write
  id-token: write

jobs:
  fmt:
    if: ${{ github.actor != 'panther-app-automation[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # Build the auto-format commit from the PR head rather than the merge commit
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: 3.11
      - name: Setup Virtual Environment
        run: make venv
      - name: Format
        run: make fmt
      - name: Update dependencies
        if: ${{ github.actor != 'dependabot[bot]' }}
        run: make reqs
      - name: Check for changes
        id: check_changes
        run: |
          git add -A .
          if git diff --cached --quiet; then
            echo "No formatting changes needed"
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "Formatting changes detected"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            git reset  # Unstage so the commit step can handle it
          fi
      - name: Fail if fork PR needs formatting
        if: ${{ steps.check_changes.outputs.has_changes == 'true' && github.event.pull_request.head.repo.fork == true }}
        run: |
          echo "::error::This PR requires formatting changes but was opened from a fork, so auto-formatting cannot be applied. Please run 'make fmt' and 'make reqs' locally and push the changes."
          exit 1
      - name: Commit formatting and any dependency updates
        if: ${{ steps.check_changes.outputs.has_changes == 'true' && github.actor != 'dependabot[bot]' && github.actor != 'dependabot-preview[bot]' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # createCommitOnBranch commits are signed by GitHub.
          # File contents go through temp files: argv is capped at ~128 KB per string.
          set -euo pipefail
          tmp="$RUNNER_TEMP/fmt-commit"
          mkdir -p "$tmp"
          { git diff -z --name-only --diff-filter=d; git ls-files -z --others --exclude-standard; } |
            while IFS= read -r -d '' path; do
              base64 -w0 "$path" > "$tmp/contents"
              jq --null-input --arg path "$path" --rawfile contents "$tmp/contents" '{$path, $contents}'
            done > "$tmp/additions.json"
          git diff -z --name-only --diff-filter=D |
            while IFS= read -r -d '' path; do
              jq --null-input --arg path "$path" '{$path}'
            done > "$tmp/deletions.json"
          jq --null-input \
            --arg repo "$REPO" --arg branch "$BRANCH" --arg oid "$HEAD_SHA" \
            --slurpfile additions "$tmp/additions.json" --slurpfile deletions "$tmp/deletions.json" \
            '{
              query: "mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { url } } }",
              variables: {input: {
                branch: {repositoryNameWithOwner: $repo, branchName: $branch},
                expectedHeadOid: $oid,
                message: {headline: "Auto-format files"},
                fileChanges: {additions: $additions, deletions: $deletions}
              }}
            }' > "$tmp/request.json"
          gh api graphql --input "$tmp/request.json"
