on:
  push:
    branches:
      - main # Splitting out main here ensures we do not redundantly run this workflow on merge from a PR
  pull_request:
    branches:
      - "*" # Match all branches

permissions:
  contents: read

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: 3.11
      - name: Setup Virtual Environment
        run: make venv
      - name: Format
        run: make fmt
      - name: Update dependencies
        run: make reqs
      - name: Check for changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Formatting or dependency changes required. Run 'make fmt && make reqs' locally and commit the result."
            git status --porcelain
            git diff --stat
            exit 1
          fi
          echo "No formatting changes needed"
