on:
  push:
    branches:
      - main # Splitting out main here ensures we do not redundantly run this workflow on merge from a PR
  pull_request:
    branches:
      - "*" # Match all branches

permissions:
  contents: write
  id-token: write

jobs:
  fmt:
    if: ${{ github.actor != 'panther-app-automation[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: 3.11
      - name: Setup Virtual Environment
        run: make venv
      - name: Format
        run: make fmt
      - name: Update dependencies
        if: ${{ github.actor != 'dependabot[bot]' }}
        run: make reqs
      - name: Check for changes
        id: check_changes
        run: |
          git add -A .
          if git diff --cached --quiet; then
            echo "No formatting changes needed"
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "Formatting changes detected"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            git reset  # Unstage so the commit step can handle it
          fi
      - name: Fail if fork PR needs formatting
        if: ${{ steps.check_changes.outputs.has_changes == 'true' && github.event.pull_request.head.repo.fork == true }}
        run: |
          echo "::error::This PR requires formatting changes but was opened from a fork, so auto-formatting cannot be applied. Please run 'make fmt' and 'make reqs' locally and push the changes."
          exit 1
      - name: Generate GitHub App token
        if: ${{ steps.check_changes.outputs.has_changes == 'true' && github.actor != 'dependabot[bot]' && github.actor != 'dependabot-preview[bot]' }}
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.PANTHER_BOT_APP_ID }}
          private-key: ${{ secrets.PANTHER_BOT_APP_PRIVATE_KEY }}
          permission-contents: write
      - name: Commit formatting and any dependency updates
        if: ${{ steps.check_changes.outputs.has_changes == 'true' && github.actor != 'dependabot[bot]' && github.actor != 'dependabot-preview[bot]' }}
        uses: panther-labs/github-actions/push-with-app@canagno123/LW-6743-reusable-app-signed-commit
        with:
          github_token: ${{ steps.app-token.outputs.token }}
          branch: ${{ github.head_ref || github.ref_name }}
          message: Auto-format files
