name: Version Bump PR

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Version Bump Type (major, minor, patch)'
        required: true
        default: 'minor'

permissions:
  contents: read

jobs:
  version_bump_pr:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
    - name: Check out the repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0

    - name: Setup Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
      with:
        python-version: 3.11
      
    - name: Install poetry
      run: make install-poetry

    - name: Bump version
      id: bump_version
      run: |
        poetry version "${{ github.event.inputs.bump_type }}"
        echo "new_version=$(poetry version -s)" >> "$GITHUB_OUTPUT"

    - name: Generate GitHub App token
      id: app-token
      uses: ./.github/actions/github-automation-token
      with:
        token_url: ${{ secrets.APP_TOKEN_SERVICE_URL }}
        permissions: '{"contents":"write","pull_requests":"write"}'

    - name: Create Branch and Pull Request
      uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
      with:
        token: ${{ steps.app-token.outputs.token }}
        sign-commits: true
        add-paths: pyproject.toml
        base: main
        branch: ${{ steps.bump_version.outputs.new_version }}
        commit-message: Bump version to ${{ steps.bump_version.outputs.new_version }}
        title: Version bump to v${{ steps.bump_version.outputs.new_version }}
        body: Bumping Version to v${{ steps.bump_version.outputs.new_version }} ahead of release.
